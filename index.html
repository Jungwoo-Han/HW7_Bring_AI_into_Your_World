<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Live Health Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1b2838;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        /* 컨트롤 패널 UI 오버레이 */
        #control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(23, 26, 33, 0.85);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a475e;
            width: 320px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            color: #66c0f4;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            background: #101822;
            border: 1px solid #2a475e;
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #66c0f4;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #47b28b 0%, #2a475e 100%);
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        button:hover {
            background: linear-gradient(90deg, #56cf9e 0%, #3b6285 100%);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <h3 style="margin-top:0; color:#fff; border-bottom: 2px solid #2a475e; padding-bottom:10px;">Steam Agent Dashboard</h3>
        
        <div class="input-group">
            <label for="apiKey">Gemini API Key</label>
            <input type="password" id="apiKey" placeholder="AIzaSy... 키를 입력하세요">
        </div>

        <div class="input-group">
            <label for="gameInput">Steam Game Name</label>
            <input type="text" id="gameInput" placeholder="예: 사펑, 배그, 스팀 인기작 추천">
        </div>

        <button id="analyzeBtn" onclick="startAgentPipeline()">Analyze & Visualize</button>
    </div>

    <div id="canvas-container"></div>

    <script src="sketch.js"></script>
</body>
</html>
